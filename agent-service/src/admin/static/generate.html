<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Generation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3;
    --text: #1a1d23; --text-mute: #667; --line: #dde1e6;
    --accent: #3a63d8; --accent-bg: #e8edfc;
    --danger: #b3261e; --danger-bg: #fbe9e7;
    --warn: #9a6700; --warn-bg: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --surface: #1b1e27; --surface-2: #232733;
      --text: #e4e6eb; --text-mute: #9aa0ac; --line: #2a2e3a;
      --accent: #7c9bef; --accent-bg: #232c47;
      --danger: #f0847c; --danger-bg: #3a1f1e;
      --warn: #e0b04d; --warn-bg: #332a10;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .app-nav {
    display: flex; gap: 0.25rem; padding: 0.6rem 1rem;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .app-nav a {
    font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: 6px;
    color: var(--text-mute); text-decoration: none;
  }
  .app-nav a:hover { background: var(--surface-2); color: var(--text); }
  .app-nav a.active { color: var(--accent); background: var(--accent-bg); }
  main { max-width: 920px; margin: 0 auto; padding: 1.75rem clamp(1rem, 4vw, 3rem) 4rem; }
  .page-head { margin-bottom: 1.5rem; }
  .page-head h1 { font-size: 0.95rem; margin: 0; }
  .page-head .subtitle { font-size: 0.75rem; color: var(--text-mute); margin-top: 0.2rem; }

  section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem 1.4rem; margin-bottom: 1.5rem; }
  section h2 { font-size: 0.95rem; margin: 0 0 1rem; }

  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .row label { font-size: 0.78rem; color: var(--text-mute); }
  select, input[type=text], input[type=number] {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.4rem 0.55rem; font-size: 0.85rem; color: var(--text); font-family: inherit;
  }
  textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.4rem 0.55rem; font-size: 0.83rem; color: var(--text); font-family: inherit;
    width: 100%; resize: vertical; min-height: 3rem;
  }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0.5rem 0.95rem; font-size: 0.83rem; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 0.4rem 0.75rem; font-size: 0.8rem; cursor: pointer;
  }
  button.ghost:hover { background: var(--surface-2); }
  button.link { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.76rem; padding: 0.1rem 0.3rem; }
  .cost-badge { color: #2f8f5b; font-weight: 800; margin-right: 0.35rem; }

  .confirm-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
    z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .confirm-modal-overlay.open { display: flex; }
  .confirm-modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.25rem 1.4rem; max-width: 26rem;
  }
  .confirm-modal p { margin: 0 0 1rem; font-size: 0.88rem; line-height: 1.5; }
  .confirm-modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }

  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.83rem; margin-bottom: 1rem; }

  .group-card { border: 1px solid var(--line); border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
  .group-card .head { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.4rem; }
  .group-card .head input { font-weight: 600; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .group-card .rationale { font-size: 0.75rem; color: var(--text-mute); margin-bottom: 0.6rem; }
  .scenario-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0; font-size: 0.85rem; }
  .scenario-row .name { flex: 1; }
  .scenario-row select { font-size: 0.78rem; }

  #status { font-size: 0.83rem; margin-left: 0.5rem; }
  #status.ok { color: #2f8f5b; }
  #status.err { color: var(--danger); }
  #corr-status { font-size: 0.83rem; margin-left: 0.5rem; }
  #corr-status.ok { color: #2f8f5b; }
  #corr-status.err { color: var(--danger); }

  .corr-row { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: flex-start; }
  .corr-row input { flex: 0 0 260px; }
  .corr-row textarea { flex: 1; }
</style>
</head>
<body>
<header class="app-nav">
  <a href="/index.html">Discovery</a>
  <a href="/visualize.html">Analysis</a>
  <a href="/generate.html" class="active">Test Generation</a>
</header>
<main>
  <div class="page-head">
    <h1>Test Generation</h1>
    <div class="subtitle">Turns an approved discovery report into a reviewed BDD test suite, one approved stage at a time</div>
  </div>

  <section>
    <h2>Stage 1: Grouping</h2>
    <div class="row">
      <label>Report</label>
      <select id="report-select"></select>
      <label title="If more than this % of scenarios can't be confidently placed in a group, skip grouping and show one flat list instead.">Ungrouped threshold ⓘ</label>
      <input type="number" id="threshold-percent" value="30" step="5" min="0" max="100" style="width:4.5rem" title="If more than this % of scenarios can't be confidently placed in a group, skip grouping and show one flat list instead.">%
      <button class="ghost" id="recompute-btn">Generate grouping</button>
      <button class="ghost" id="show-approved-grouping-btn" style="display:none">Show last approved grouping</button>
    </div>
    <div id="grouping-body"></div>
    <div class="row">
      <button class="primary" id="approve-btn" disabled style="display:none">Approve grouping</button>
      <span id="status"></span>
    </div>
  </section>

  <section>
    <h2>Stage 2: Structured spec <span style="font-weight:400;color:var(--text-mute);font-size:0.78rem">(calls Claude — costs money)</span></h2>
    <div class="row">
      <label>Approved grouping</label>
      <select id="spec-grouping-select"></select>
      <label>Descriptor</label>
      <input type="text" id="spec-descriptor" value="orderflow" style="width:8rem">
      <label title="Stage 1 groups are never capped or dropped — a group bigger than this just gets sent as several separate Claude calls instead of one, and the results are combined back into the same group.">Scenarios per Claude call ⓘ</label>
      <input type="number" id="spec-max-scenarios" value="6" style="width:4rem" title="Stage 1 groups are never capped or dropped — a group bigger than this just gets sent as several separate Claude calls instead of one, and the results are combined back into the same group.">
      <label title="Same Stage 1 group names shown above (e.g. &quot;orders&quot;) — matches the whole group regardless of how many Claude calls it internally needs. Leave empty to generate every group.">Limit to groups (optional) ⓘ</label>
      <input type="text" id="spec-groups-filter" placeholder="e.g. security,customers" style="width:12rem" title="Same Stage 1 group names shown above (e.g. &quot;orders&quot;) — matches the whole group regardless of how many Claude calls it internally needs. Leave empty to generate every group.">
    </div>
    <div class="row">
      <button class="primary" id="spec-generate-btn"><span class="cost-badge">$</span>Generate spec</button>
      <span id="spec-gen-status"></span>
    </div>
    <div id="spec-body"></div>
    <div class="row">
      <button class="primary" id="spec-approve-btn" disabled style="display:none">Approve spec</button>
      <span id="spec-status"></span>
    </div>
  </section>

  <section>
    <h2>Scenario corrections</h2>
    <div class="row">
      <label>Descriptor</label>
      <input type="text" id="descriptor-name" value="orderflow" style="width:10rem">
      <button class="ghost" id="load-corr-btn">Load</button>
      <button class="ghost" id="add-corr-btn">+ Add correction</button>
    </div>
    <div id="corr-body"></div>
    <div class="row">
      <button class="primary" id="save-corr-btn">Save corrections</button>
      <span id="corr-status"></span>
    </div>
  </section>
</main>

<div class="confirm-modal-overlay" id="confirm-modal-overlay">
  <div class="confirm-modal">
    <p id="confirm-modal-message"></p>
    <div class="confirm-modal-actions">
      <button class="primary" id="confirm-modal-cancel">Cancel</button>
      <button class="ghost" id="confirm-modal-ok">Yes, proceed</button>
    </div>
  </div>
</div>

<script>
// Any button that calls Claude for real must be confirmed first — resolves
// true only if the human clicks "Yes, proceed"; Cancel, Escape, or clicking
// the backdrop all resolve false without touching the network.
function confirmPaidAction(message) {
  return new Promise((resolve) => {
    document.getElementById('confirm-modal-message').textContent = message;
    const overlay = document.getElementById('confirm-modal-overlay');
    overlay.classList.add('open');
    // Cancel, not "Yes, proceed", is the default — focusing it means Enter
    // does the safe thing on a modal that exists specifically to warn about
    // spending real money.
    document.getElementById('confirm-modal-cancel').focus();
    const cleanup = (result) => {
      overlay.classList.remove('open');
      document.removeEventListener('keydown', onKey);
      resolve(result);
    };
    const onKey = (e) => { if (e.key === 'Escape') cleanup(false); };
    document.getElementById('confirm-modal-ok').onclick = () => cleanup(true);
    document.getElementById('confirm-modal-cancel').onclick = () => cleanup(false);
    document.addEventListener('keydown', onKey);
    overlay.onclick = (e) => { if (e.target === overlay) cleanup(false); };
  });
}

const state = { grouping: null };

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = kind || '';
}

// --- Grouping -------------------------------------------------------------

async function loadReportList() {
  const names = await api('/api/generate/reports');
  const select = document.getElementById('report-select');
  select.innerHTML = names.map((n) => `<option value="${n}">${n}</option>`).join('');
  if (names.length > 0) select.value = names[names.length - 1];
}

// Lets a report reselect reveal "Show last approved grouping" for free,
// instead of forcing a fresh (re-)grouping just to see what was already
// approved for this report in an earlier session.
async function onReportChanged() {
  const btn = document.getElementById('show-approved-grouping-btn');
  btn.style.display = 'none';
  state.existingApprovedGrouping = null;
  const report = document.getElementById('report-select').value;
  if (!report) return;
  try {
    const existing = await api('/api/generate/grouping-for-report?report=' + encodeURIComponent(report));
    if (!existing) return;
    state.existingApprovedGrouping = existing;
    btn.style.display = '';
  } catch (e) {
    setStatus(document.getElementById('status'), 'Failed to check for an existing approved grouping: ' + e.message, 'err');
  }
}
// Native <select> only fires "change" when the value actually differs, so
// re-picking the already-selected report fires nothing — "click" catches
// that case too (same reasoning as visualize.html's onArchReportChanged).
document.getElementById('report-select').addEventListener('change', onReportChanged);
document.getElementById('report-select').addEventListener('click', onReportChanged);

document.getElementById('show-approved-grouping-btn').onclick = () => {
  if (!state.existingApprovedGrouping) return;
  state.grouping = state.existingApprovedGrouping.approved;
  renderGrouping();
  setStatus(document.getElementById('status'), 'Loaded approved grouping from ' + state.existingApprovedGrouping.path, 'ok');
};

function allGroupKeys() {
  return state.grouping ? state.grouping.groups.map((g) => g.key) : [];
}

function moveScenario(name, fromKey, toKey) {
  const g = state.grouping;
  if (fromKey === '__ungrouped__') g.ungrouped = g.ungrouped.filter((n) => n !== name);
  else {
    const group = g.groups.find((gr) => gr.key === fromKey);
    group.scenarioNames = group.scenarioNames.filter((n) => n !== name);
  }
  if (toKey === '__ungrouped__') g.ungrouped.push(name);
  else {
    const group = g.groups.find((gr) => gr.key === toKey);
    group.scenarioNames.push(name);
  }
  renderGrouping();
}

function renderScenarioRow(name, currentKey) {
  const row = document.createElement('div');
  row.className = 'scenario-row';
  const label = document.createElement('span');
  label.className = 'name';
  label.textContent = name;
  const select = document.createElement('select');
  for (const key of allGroupKeys()) {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = key;
    if (key === currentKey) opt.selected = true;
    select.appendChild(opt);
  }
  const ungroupedOpt = document.createElement('option');
  ungroupedOpt.value = '__ungrouped__'; ungroupedOpt.textContent = 'ungrouped';
  if (currentKey === '__ungrouped__') ungroupedOpt.selected = true;
  select.appendChild(ungroupedOpt);
  select.onchange = () => moveScenario(name, currentKey, select.value);
  row.appendChild(label);
  row.appendChild(select);
  return row;
}

function renderGrouping() {
  const body = document.getElementById('grouping-body');
  body.innerHTML = '';
  // Hidden, not just disabled, while the block is still collapsed (no
  // grouping loaded yet) — a disabled button sitting there implies there's
  // something to approve once enabled, which isn't true until Generate runs.
  const approveBtn = document.getElementById('approve-btn');
  approveBtn.style.display = state.grouping ? '' : 'none';
  approveBtn.disabled = !state.grouping;
  if (!state.grouping) return;
  const g = state.grouping;

  if (g.flatFallback) {
    const total = g.groups.reduce((n, gr) => n + gr.scenarioNames.length, 0) + g.ungrouped.length;
    const pct = total > 0 ? Math.round((g.ungrouped.length / total) * 100) : 0;
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.textContent = `Low confidence: ${g.ungrouped.length} of ${total} scenarios (${pct}%) didn't clearly match one group — the groups below are still the heuristic's real guess, just flagged as unreliable. Check "ungrouped" below and move scenarios into a group by hand, or approve as-is if it already looks right.`;
    body.appendChild(banner);
  }

  for (const group of g.groups) {
    const card = document.createElement('div');
    card.className = 'group-card';
    const head = document.createElement('div');
    head.className = 'head';
    const keyInput = document.createElement('input');
    keyInput.type = 'text'; keyInput.value = group.key;
    keyInput.oninput = () => { group.key = keyInput.value; };
    const count = document.createElement('span');
    count.style.color = 'var(--text-mute)'; count.style.fontSize = '0.78rem';
    count.textContent = `${group.scenarioNames.length} scenario(s)`;
    head.appendChild(keyInput);
    head.appendChild(count);
    card.appendChild(head);
    if (group.rationale) {
      const rationale = document.createElement('div');
      rationale.className = 'rationale';
      rationale.textContent = group.rationale;
      card.appendChild(rationale);
    }
    for (const name of group.scenarioNames) card.appendChild(renderScenarioRow(name, group.key));
    body.appendChild(card);
  }

  if (g.ungrouped.length > 0) {
    const card = document.createElement('div');
    card.className = 'group-card';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<strong>ungrouped</strong>';
    card.appendChild(head);
    for (const name of g.ungrouped) card.appendChild(renderScenarioRow(name, '__ungrouped__'));
    body.appendChild(card);
  }
}

document.getElementById('recompute-btn').onclick = async () => {
  const report = document.getElementById('report-select').value;
  const threshold = Number(document.getElementById('threshold-percent').value) / 100;
  const statusEl = document.getElementById('status');
  try {
    state.grouping = await api('/api/generate/group', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ report, threshold }),
    });
    renderGrouping();
    setStatus(statusEl, '');
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

document.getElementById('approve-btn').onclick = async () => {
  const statusEl = document.getElementById('status');
  try {
    const result = await api('/api/generate/group/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state.grouping),
    });
    setStatus(statusEl, 'Approved → ' + result.path, 'ok');
    // Stage 2's dropdown was only ever populated once at page load — without
    // this, a freshly-approved grouping exists on disk but stays invisible
    // there until a full page reload.
    await loadGroupingList();
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

// --- Stage 2: spec ----------------------------------------------------------

let specState = null; // { generatedAt, sourceGroupingPath, scenarios: [...] }

async function loadGroupingList() {
  const names = await api('/api/generate/groupings');
  const select = document.getElementById('spec-grouping-select');
  select.innerHTML = names.map((n) => `<option value="${n}">${n}</option>`).join('');
  if (names.length > 0) select.value = names[names.length - 1];
}

function renderSpec() {
  const body = document.getElementById('spec-body');
  body.innerHTML = '';
  const approveBtn = document.getElementById('spec-approve-btn');
  approveBtn.style.display = specState ? '' : 'none';
  approveBtn.disabled = !specState || specState.scenarios.length === 0;
  if (!specState) return;

  for (const scenario of specState.scenarios) {
    const card = document.createElement('div');
    card.className = 'group-card';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `<strong>${scenario.scenarioName}</strong>`;
    const meta = document.createElement('span');
    meta.style.color = 'var(--text-mute)'; meta.style.fontSize = '0.78rem';
    meta.textContent = `[${scenario.group}] ${scenario.type}`;
    head.appendChild(meta);
    card.appendChild(head);

    const ta = document.createElement('textarea');
    ta.rows = 10;
    ta.style.width = '100%';
    ta.style.fontFamily = 'ui-monospace, "SF Mono", Consolas, monospace';
    ta.style.fontSize = '0.78rem';
    ta.value = JSON.stringify({ given: scenario.given, when: scenario.when, then: scenario.then, unconfirmed: scenario.unconfirmed ?? null }, null, 2);
    const err = document.createElement('div');
    err.style.color = 'var(--danger)'; err.style.fontSize = '0.76rem'; err.style.marginTop = '0.2rem';
    ta.oninput = () => {
      try {
        const parsed = JSON.parse(ta.value);
        Object.assign(scenario, parsed);
        err.textContent = '';
      } catch (e) {
        err.textContent = 'Invalid JSON — edit not applied yet: ' + e.message;
      }
    };
    card.appendChild(ta);
    card.appendChild(err);
    body.appendChild(card);
  }
}

document.getElementById('spec-generate-btn').onclick = async () => {
  const grouping = document.getElementById('spec-grouping-select').value;
  const descriptor = document.getElementById('spec-descriptor').value;
  const maxScenarios = Number(document.getElementById('spec-max-scenarios').value);
  const groupsRaw = document.getElementById('spec-groups-filter').value.trim();
  const groups = groupsRaw ? groupsRaw.split(',').map((s) => s.trim()).filter(Boolean) : undefined;
  const statusEl = document.getElementById('spec-gen-status');
  if (!(await confirmPaidAction(`Generate a structured spec from grouping "${grouping}"? This calls Claude and costs real money.`))) return;
  setStatus(statusEl, 'Calling Claude — this costs money and may take a while…');
  try {
    const result = await api('/api/generate/spec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ grouping, descriptor, maxScenarios, groups }),
    });
    specState = result.spec;
    renderSpec();
    setStatus(statusEl, result.failures.length ? `Done, but failed: ${result.failures.join(', ')}` : 'Done.', result.failures.length ? 'err' : 'ok');
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

document.getElementById('spec-approve-btn').onclick = async () => {
  const statusEl = document.getElementById('spec-status');
  try {
    const result = await api('/api/generate/spec/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(specState),
    });
    setStatus(statusEl, 'Approved → ' + result.path, 'ok');
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

// --- Corrections -----------------------------------------------------------

let corrections = {};

function renderCorrections() {
  const body = document.getElementById('corr-body');
  body.innerHTML = '';
  for (const scenarioName of Object.keys(corrections)) {
    const row = document.createElement('div');
    row.className = 'corr-row';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = scenarioName;
    nameInput.placeholder = 'Exact scenario name';
    const text = document.createElement('textarea');
    text.value = corrections[scenarioName];
    text.oninput = () => { corrections[nameInput.value] = text.value; };
    nameInput.onchange = () => {
      if (nameInput.value !== scenarioName) {
        delete corrections[scenarioName];
        corrections[nameInput.value] = text.value;
        renderCorrections();
      }
    };
    const removeBtn = document.createElement('button');
    removeBtn.className = 'link'; removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => { delete corrections[scenarioName]; renderCorrections(); };
    row.appendChild(nameInput);
    row.appendChild(text);
    row.appendChild(removeBtn);
    body.appendChild(row);
  }
}

document.getElementById('load-corr-btn').onclick = async () => {
  const name = document.getElementById('descriptor-name').value;
  const statusEl = document.getElementById('corr-status');
  try {
    corrections = await api('/api/generate/corrections/' + encodeURIComponent(name));
    renderCorrections();
    setStatus(statusEl, '');
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

document.getElementById('add-corr-btn').onclick = () => {
  let key = 'New scenario name';
  let i = 1;
  while (key in corrections) key = `New scenario name ${++i}`;
  corrections[key] = '';
  renderCorrections();
};

document.getElementById('save-corr-btn').onclick = async () => {
  const name = document.getElementById('descriptor-name').value;
  const statusEl = document.getElementById('corr-status');
  try {
    await api('/api/generate/corrections/' + encodeURIComponent(name), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corrections),
    });
    setStatus(statusEl, 'Saved.', 'ok');
  } catch (e) {
    setStatus(statusEl, 'Failed: ' + e.message, 'err');
  }
};

loadReportList().then(onReportChanged);
loadGroupingList();
</script>
