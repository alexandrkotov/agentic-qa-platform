<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3;
    --text: #1a1d23; --text-mute: #667; --line: #dde1e6;
    --accent: #3a63d8; --accent-bg: #e8edfc;
    --danger: #b3261e; --danger-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --surface: #1b1e27; --surface-2: #232733;
      --text: #e4e6eb; --text-mute: #9aa0ac; --line: #2a2e3a;
      --accent: #7c9bef; --accent-bg: #232c47;
      --danger: #f0847c; --danger-bg: #3a1f1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .app-nav {
    display: flex; gap: 0.25rem; padding: 0.6rem 1rem;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .app-nav a {
    font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: 6px;
    color: var(--text-mute); text-decoration: none; border: 1px solid var(--line);
  }
  .app-nav a:hover { background: var(--surface-2); color: var(--text); }
  .app-nav a.active { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
  /* Shared verbatim across generate.html/visualize.html/index.html/e2e.html so
     the title never visibly shifts left/right or up/down when switching
     pages — sits outside each page's own (differently laid out) content
     column. */
  .page-head { padding: 1.5rem clamp(1rem, 4vw, 3rem) 1.25rem; }
  .page-head h1 { font-size: 0.95rem; margin: 0; }
  .page-head .subtitle { font-size: 0.75rem; color: var(--text-mute); margin-top: 0.2rem; }

  main { max-width: 640px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 3rem) 4rem; text-align: center; }
  .empty-state { margin-top: 3rem; color: var(--text-mute); }
  .empty-state h2 { color: var(--text); font-size: 1.05rem; margin: 0 0 0.5rem; }
  .empty-state p { font-size: 0.88rem; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<header class="app-nav">
  <a href="/index.html">Discovery</a>
  <a href="/visualize.html">Analysis</a>
  <a href="/generate.html">Test Suite</a>
  <a href="/e2e.html" class="active">E2E</a>
</header>
<div class="page-head">
  <h1>E2E</h1>
  <div class="subtitle">Diagnoses and repairs failing end-to-end scenarios — this tab isn't built yet</div>
</div>
<main>
  <div class="empty-state">
    <h2>Coming soon</h2>
    <p>This tab will host the UI for the E2E maintenance agent — nothing is wired up here yet.</p>
  </div>
</main>
</body>
</html>
