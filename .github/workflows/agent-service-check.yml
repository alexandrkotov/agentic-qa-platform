name: Agent service checks

on:
  push:
    branches: [main]
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-service-check.yml'
  pull_request:
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-service-check.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-service/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: agent-service
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: agent-service
        run: pnpm typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build workbench image
        run: docker compose build workbench
