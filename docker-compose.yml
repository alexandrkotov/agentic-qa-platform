services:
  app:
    build: ./app
    ports: ["3000:3000"]
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/testdb
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - app

  report:
    image: nginx:alpine
    ports: ["8080:80", "80:8000"]
    volumes:
      - ./tests/reports/cucumber-html:/usr/share/nginx/html:ro
      - ./agent-service/reports/usage-html:/usr/share/nginx/usage-html:ro
      - ./hub:/usr/share/nginx/hub:ro
      - ./report-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: testdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Second discovery proof point (alongside postgres) for the System Descriptor —
  # single-node KRaft broker, no ZooKeeper. PLAINTEXT is for other containers
  # on the compose network (e.g. kafka-ui); PLAINTEXT_HOST is for anything
  # reaching it from the host, incl. the dockerized kafka-mcp-server started
  # with --network=host.
  kafka:
    image: apache/kafka:latest
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Admin UI for the broker above — convenience for humans, not used by the
  # discovery agent (which talks to Kafka via kafka-mcp-server instead).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # Admin UI: the System Descriptor editor (agent-service/descriptors/*.json),
  # Discovery (runs the same agent `pnpm discovery` does), and the Generate
  # pipeline's review pages (grouping/spec approval, per-descriptor scenario
  # corrections) — one small Express app, its own image (Dockerfile.admin)
  # rather than the full agent-service one. Needs both descriptors/
  # (read/write live) and reports/ (discovery writes reports here; Stage 1/2
  # read discovery reports and write/read their own generate-*.json
  # artifacts).
  #
  # Plain bridge networking + `ports:` (NOT network_mode: host — tried that
  # first; it doesn't reliably forward to a real host browser under Docker
  # Desktop/WSL2, unlike native Linux, and broke access to this page
  # entirely). Every descriptor's component URLs are written as plain
  # `localhost:PORT`, correct for `pnpm discovery` run directly on the host
  # but *wrong* for a bridge-network container, where "localhost" is the
  # container's own loopback. admin/server.ts's discovery route rewrites
  # postgres/rest-api/web-ui URLs to this compose network's service names
  # (db/app/frontend) before calling runDiscoveryForDescriptor() — but
  # deliberately leaves Kafka broker addresses alone: the Kafka MCP server is
  # a *sibling* container this one launches via the mounted Docker socket
  # below, with its own `--network=host` (descriptor/components/kafka.ts) —
  # that's a peer of the Docker daemon, not a child of this container's own
  # network namespace, so it reaches the real host-published broker port
  # (`localhost:9094`) regardless of which network *this* container is on.
  #
  # /var/run/docker.sock: see above — needed to launch that sibling
  # container at all.
  #
  # env_file: this service had no ANTHROPIC_API_KEY at all before Discovery
  # and Stage 2 spec generation were added to it — neither had ever actually
  # been exercised through this container (only through `pnpm admin` on the
  # host, which picks up agent-service/.env itself via dotenv). Same file
  # here, so container and host stay in sync automatically.
  admin:
    build:
      context: ./agent-service
      dockerfile: Dockerfile.admin
    ports: ["4400:4400"]
    env_file: ./agent-service/.env
    volumes:
      - ./agent-service/descriptors:/usr/src/app/descriptors
      - ./agent-service/reports:/usr/src/app/reports
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
