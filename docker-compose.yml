services:
  report:
    image: nginx:alpine
    ports: ["8080:80", "80:8000"]
    volumes:
      - ./tests/reports/cucumber-html:/usr/share/nginx/html:ro
      - ./agent-service/reports/usage-html:/usr/share/nginx/usage-html:ro
      - ./hub:/usr/share/nginx/hub:ro
      - ./report-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Admin UI for the Kafka broker — that broker itself now lives in
  # docker-compose.demo-orderflow.yml (the bundled OrderFlow demo's own
  # group, `bdd-target-demo-orderflow`), not here. Reachable by plain
  # hostname (kafka:9092) only because both projects share the
  # `agentic-qa-platform-net` network declared below — if the demo group
  # isn't deployed, this shows disconnected, which is expected, not a bug
  # (see the hub page's own note next to this card). Not used by the
  # discovery agent (which talks to Kafka via kafka-mcp-server instead).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # Workbench: the System Descriptor editor (agent-service/descriptors/*.json),
  # Discovery (runs the same agent `pnpm discovery` does), Analysis, and the
  # Generate pipeline's review pages (grouping/spec approval, per-descriptor
  # scenario corrections) — one small Express app, its own image
  # (Dockerfile.workbench) rather than the full agent-service one. Needs both descriptors/
  # (read/write live) and reports/ (discovery writes reports here; Stage 1/2
  # read discovery reports and write/read their own generate-*.json
  # artifacts).
  #
  # Plain bridge networking + `ports:` (NOT network_mode: host — tried that
  # first; it doesn't reliably forward to a real host browser under Docker
  # Desktop/WSL2, unlike native Linux, and broke access to this page
  # entirely). Every descriptor's component URLs are written as plain
  # `localhost:PORT`, correct for `pnpm discovery` run directly on the host
  # but *wrong* for a bridge-network container, where "localhost" is the
  # container's own loopback. admin/server.ts's discovery route rewrites
  # postgres/rest-api/web-ui URLs to this compose network's service names
  # (db/app/frontend) before calling runDiscoveryForDescriptor() — but
  # deliberately leaves Kafka broker addresses alone: the Kafka MCP server is
  # a *sibling* container this one launches via the mounted Docker socket
  # below, with its own `--network=host` (descriptor/components/kafka.ts) —
  # that's a peer of the Docker daemon, not a child of this container's own
  # network namespace, so it reaches the real host-published broker port
  # (`localhost:9094`) regardless of which network *this* container is on.
  #
  # A `docker-compose` component (descriptor/components/dockerCompose.ts)
  # is a third case, closer to Kafka's than to postgres/rest-api/web-ui's:
  # bootstrap/deployTarget.ts clones the target's own repo and runs its
  # compose file for real, over this same mounted socket, then reports back
  # `host.docker.internal:<port>` URLs — never `localhost:PORT` — so they
  # never enter admin/server.ts's rewrite map at all (the loopback-only gate
  # there, LOOPBACK_HOSTNAMES, exists specifically so a hand-written
  # external-target URL is never mistaken for this fixed sample app's own
  # `localhost` convention and silently clobbered into pointing at
  # db/app/frontend instead). Reaching those published ports from *this*
  # bridge-networked container needs `extra_hosts: host.docker.internal`
  # below — Docker Desktop provides that name automatically, plain Engine
  # does not. See the `targets` volume's own comment further down for the
  # bigger gotcha this same deploy mechanism runs into: making a *cloned
  # repo's* relative bind-mount paths resolve correctly against the host's
  # filesystem, not this container's.
  #
  # /var/run/docker.sock: see above — needed to launch that sibling
  # container at all.
  #
  # env_file: this service had no ANTHROPIC_API_KEY at all before Discovery
  # and Stage 2 spec generation were added to it — neither had ever actually
  # been exercised through this container (only through `pnpm workbench` on
  # the host, which picks up agent-service/.env itself via dotenv). Same file
  # here, so container and host stay in sync automatically.
  workbench:
    build:
      context: ./agent-service
      dockerfile: Dockerfile.workbench
    ports: ["4400:4400"]
    env_file:
      - path: ./agent-service/.env
        required: false
    # HOST_PROJECT_ROOT + the targets/ mount below are a matched pair — see
    # that mount's own comment for why the value has to be this repo's own
    # absolute host path, not any arbitrary string. ${PWD} here means the
    # directory `docker compose` itself is invoked from on the HOST, which
    # is why this project's convention (deploy from the main checkout, not
    # a worktree) matters more than usual for this one variable specifically.
    environment:
      HOST_PROJECT_ROOT: ${PWD}
    # host.docker.internal isn't automatic outside Docker Desktop — this
    # `host-gateway` sentinel (Engine 20.10+) is what makes it resolve on
    # plain Docker Engine too. Needed so this container can reach ports a
    # docker-compose-deployed target publishes on the HOST (see
    # descriptor/components/dockerCompose.ts) — this container itself sits
    # on its own bridge network below, not host networking, so it can't
    # just say "localhost" for those ports the way a process on the host
    # itself could.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # tests/ is a separate package with its own @playwright/test version, so
    # it needs its own browser binary — the one the Dockerfile installs at
    # build time is for agent-service's own @playwright/mcp dependency, a
    # different (and not necessarily version-compatible) Playwright install.
    # Confirmed live: "Run tests" failed every single scenario with
    # "chrome-headless-shell-1228 doesn't exist" while the image only had
    # build 1232 (whatever agent-service's own install pulled in). tests/
    # isn't present at image-build time (bind-mounted, not baked in), so this
    # has to run at container *start* instead — the playwright-browsers
    # volume below makes that a no-op after the first successful start
    # rather than a fresh multi-hundred-MB download every restart.
    #
    # PLAYWRIGHT_BROWSERS_PATH (set in Dockerfile.workbench) points both this
    # runtime install AND the build-time one at the SAME shared directory —
    # confirmed live on a real GitHub Actions run that without this, the two
    # installs used different cache paths (root's own $HOME at build time vs.
    # node's own $HOME at runtime — this container runs as the non-root
    # "node" user, docker-entrypoint.sh), so the build-time browser was
    # unreachable at runtime and got silently re-downloaded from scratch on
    # every single container start; that alone pushed a fresh CI run's own
    # "wait for workbench" step past a 10-minute budget, twice, at two
    # different timeout values, so this was a real, measured cost, not a
    # one-off blip. Now agent-service's own `npx playwright install chromium`
    # below is normally a fast idempotency check, not a real download — only
    # tests/'s own separately-versioned browser still needs the actual
    # download, and even that's a no-op after the first successful start
    # thanks to the volume below.
    command: sh -c "npx playwright install chromium; (cd tests && npx playwright install chromium); npx tsx src/admin/server.ts"
    volumes:
      - ./agent-service/descriptors:/usr/src/app/descriptors
      - ./agent-service/reports:/usr/src/app/reports
      # Per-target first-run setup scripts (bootstrap/setupTarget.ts's own
      # hasSetup()/runSetup() convention) — deliberately its OWN mount, not
      # part of the rest of agent-service/src/ (baked into the image via
      # COPY, not mounted, see Dockerfile.workbench). This container runs
      # straight off `npx tsx src/admin/server.ts` with no build step, and
      # runSetup() already dynamic-`import()`s per call, so a file the
      # "Record setup" UI writes here at runtime is importable on the very
      # next request — no rebuild needed, unlike everything else under
      # src/. Only a handful of these are actually git-tracked (see
      # .gitignore's own targeted-exclusion block, same trick already used
      # for archive/'s two demo snapshots) — anything newly generated
      # starts as an untracked file here, same as a fresh archive/ snapshot.
      - ./agent-service/src/bootstrap/setup:/usr/src/app/src/bootstrap/setup
      # Point-in-time snapshots of the test suite + its source artifacts,
      # written before "Write files" overwrites tests/ — at the repo ROOT
      # (the user's own call), not nested under agent-service/: the bundle
      # itself pulls content from both agent-service/ (descriptors, reports)
      # AND tests/, two sibling top-level directories, so it doesn't belong
      # to either one specifically. Needs its own bind mount here too:
      # without this, a snapshot would only ever land on the container's
      # own ephemeral filesystem and vanish the next time this container is
      # recreated.
      - ./archive:/usr/src/app/archive
      # Repo clones for the docker-compose component type
      # (descriptor/components/dockerCompose.ts) — deliberately mounted at
      # an IDENTICAL absolute path on both sides (${PWD}/targets, not
      # ./targets:/usr/src/app/targets the way archive/reports above do),
      # because this one has to survive a second hop this container makes
      # through the mounted docker.sock below: when bootstrap/deployTarget.ts
      # asks the HOST's own daemon to `docker compose up` a cloned target
      # repo, the daemon resolves that repo's own relative bind-mount paths
      # (e.g. wger's `./config/nginx.conf`) against ITS OWN filesystem, not
      # this container's. If the two paths ever differ, Docker doesn't
      # error — it silently creates an empty directory where the real file
      # should be, and whatever service reads it fails confusingly instead.
      # Mirroring the path turns that failure mode into "the file's just
      # there" instead of something to debug. HOST_PROJECT_ROOT above lets
      # the app construct this same absolute path itself; deployTarget.ts
      # also verifies the mirror actually holds via `docker inspect` before
      # trusting it, rather than assuming this comment stayed accurate.
      - ${PWD}/targets:${PWD}/targets
      # The bundled OrderFlow demo's own compose file
      # (docker-compose.demo-orderflow.yml) — same identical-absolute-path
      # mirroring trick as targets/ just above, for the same reason: the
      # /api/demo/switch route (server.ts) runs `docker compose -f <this
      # file>` over the mounted docker.sock below, and the file's own
      # relative bind mounts (`./app`, `./frontend`) get resolved against
      # the HOST daemon's filesystem, not this container's — mirroring the
      # path is what makes that resolve to the real host directories
      # instead of silently creating empty ones. Read-only: this container
      # never needs to write to it, and (unlike targets/) `up` here never
      # passes `--build`, so it doesn't need to read app/'s or frontend's
      # own source content either — just the compose file's own text.
      - ${PWD}/docker-compose.demo-orderflow.yml:${PWD}/docker-compose.demo-orderflow.yml:ro
      # Stage 3 (render) writes .feature/.steps.ts here, and "Run tests"
      # executes the suite from here — without this mount, either action
      # would only touch the container's own ephemeral filesystem, never
      # the real tests/ directory this project's suite actually lives in.
      - ./tests:/usr/src/app/tests
      # Matches PLAYWRIGHT_BROWSERS_PATH (Dockerfile.workbench) — NOT
      # /home/node/.cache/ms-playwright (Playwright's own un-overridden
      # default, keyed to whichever user's $HOME is active), which is
      # exactly the mismatch that made the build-time-installed browser
      # unreachable at runtime (see the command's own comment above). A
      # useful side effect of the shared path, confirmed live: Docker
      # auto-seeds a brand-new named volume from the image's own existing
      # content at the same mount point on first use, so even a completely
      # fresh volume (e.g. a first-ever run on a new GitHub Actions runner,
      # which never persists volumes across runs) starts pre-populated with
      # whatever the image already baked in at build time, not empty.
      - playwright-browsers:/ms-playwright
      - /var/run/docker.sock:/var/run/docker.sock
      # Lets server.ts ask the real `git` (already installed for
      # deployTarget.ts's own clones — see Dockerfile.workbench) whether a
      # given archive/ snapshot is one of the two git-tracked ones, rather
      # than re-deriving that from .gitignore's own exact syntax by hand —
      # the DELETE snapshot route refuses to touch a git-tracked entry.
      # Read-only: this container only ever reads git's own tracked-file
      # state, never commits/writes through this mount.
      - ./.git:/usr/src/app/.git:ro

volumes:
  playwright-browsers:

# Named (not the fragile directory-basename default Compose would otherwise
# derive) so docker-compose.demo-orderflow.yml — a separate compose project,
# `bdd-target-demo-orderflow` — can join it as `external: true` by this same
# fixed name. This is what lets `workbench`/`kafka-ui` above keep reaching
# `db`/`app`/`frontend`/`kafka` (now in that other project) by plain
# hostname, exactly as when they all lived in this one file. This project
# owns creation — bring this file up at least once before
# docker-compose.demo-orderflow.yml.
networks:
  default:
    name: agentic-qa-platform-net
