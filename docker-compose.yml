services:
  app:
    build: ./app
    ports: ["3000:3000"]
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/testdb

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - app

  report:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./tests/reports/cucumber-html:/usr/share/nginx/html:ro
      - ./agent-service/reports/usage-html:/usr/share/nginx/usage-html:ro
      - ./report-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: testdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
