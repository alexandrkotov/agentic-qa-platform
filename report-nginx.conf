server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # AI usage/cost report (agent-service/src/usageLog.ts). Served from a
    # sibling directory, not a subdirectory of the (read-only) cucumber-html
    # mount above -- Docker can't create a new mountpoint inside an already
    # read-only bind mount, confirmed the hard way when this was first
    # attempted as /usr/share/nginx/html/usage.
    #
    # /usage (no trailing slash) doesn't match the alias-based location
    # below at all -- it falls through to location / above, serving 404
    # from the wrong root. Confirmed live. Redirect it explicitly.
    # $http_host (not $host) is required here -- $host drops the :8080
    # port, which sent the redirect to the wrong port. Confirmed live.
    location = /usage {
        return 301 $scheme://$http_host/usage/;
    }

    location /usage/ {
        alias /usr/share/nginx/usage-html/;
        # Checking for the *file* index.html specifically -- not $uri/ --
        # matters: try_files treats an existing (but empty, or not-yet-
        # populated) directory as a successful match and falls into normal
        # directory/index handling (403, no autoindex) *without* ever
        # reaching the @usage_empty fallback below. Confirmed live: this
        # broke the placeholder the first time, since the bind-mounted
        # directory itself always exists once the container has started
        # once, even before recordUsage() ever runs.
        try_files $uri/index.html @usage_empty;
    }

    location @usage_empty {
        add_header Content-Type "text/html; charset=utf-8" always;
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="refresh" content="5"><title>Agent Service — AI Usage Log</title><style>body{background:#12141a;color:#e4e6eb;font-family:system-ui,sans-serif;margin:2rem;}h1{font-size:1.3rem;}code{background:#1b1e27;padding:0.15rem 0.4rem;border-radius:4px;}p{color:#8a8f98;}</style></head><body><h1>Agent Service — AI Usage Log</h1><p>No usage recorded yet. Run <code>pnpm discovery</code>, <code>pnpm testgen</code>, or <code>pnpm e2e</code> from <code>agent-service/</code> to log the first AI call. This page auto-refreshes every 5s.</p></body></html>';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Hub page — links to every local service (frontend, Swagger, this report,
# Kafka UI, descriptor editor). Separate server block on its own internal
# port rather than touching the one above, which already has a few hard-won
# fixes documented inline (see comments above) that this has no need to
# risk. Mapped to the default HTTP port on the host (docker-compose.yml),
# so it's just "localhost", no port number.
server {
    listen 8000;
    server_name localhost;

    location / {
        root /usr/share/nginx/hub;
        index index.html;
    }
}
