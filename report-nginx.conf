server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # AI usage/cost report (agent-service/src/usageLog.ts). Served from a
    # sibling directory, not a subdirectory of the (read-only) cucumber-html
    # mount above -- Docker can't create a new mountpoint inside an already
    # read-only bind mount, confirmed the hard way when this was first
    # attempted as /usr/share/nginx/html/usage.
    location /usage/ {
        alias /usr/share/nginx/usage-html/;
        index index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
